<!-- Fondo SVG animado + Logo Jellyfin — incluido en todas las páginas del wizard -->
<div class="jf-wizard-bg" aria-hidden="true">
    <svg viewBox="0 0 1440 900" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
        <defs>
            <filter id="jf-blur1" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="75"/></filter>
            <filter id="jf-blur2" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="95"/></filter>
            <filter id="jf-blur3" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="80"/></filter>
            <radialGradient id="jf-g1" cx="50%" cy="50%" r="50%">
                <stop offset="0%" stop-color="#00a4dc" stop-opacity="0.55"/>
                <stop offset="100%" stop-color="#00a4dc" stop-opacity="0"/>
            </radialGradient>
            <radialGradient id="jf-g2" cx="50%" cy="50%" r="50%">
                <stop offset="0%" stop-color="#aa5cc3" stop-opacity="0.5"/>
                <stop offset="100%" stop-color="#aa5cc3" stop-opacity="0"/>
            </radialGradient>
            <radialGradient id="jf-g3" cx="50%" cy="50%" r="50%">
                <stop offset="0%" stop-color="#0077b6" stop-opacity="0.38"/>
                <stop offset="100%" stop-color="#0077b6" stop-opacity="0"/>
            </radialGradient>
        </defs>
        <ellipse class="jf-blob-1" cx="220" cy="240" rx="340" ry="280" fill="url(#jf-g1)" filter="url(#jf-blur1)"/>
        <ellipse class="jf-blob-2" cx="1200" cy="680" rx="380" ry="300" fill="url(#jf-g2)" filter="url(#jf-blur2)"/>
        <ellipse class="jf-blob-3" cx="780" cy="420" rx="300" ry="240" fill="url(#jf-g3)" filter="url(#jf-blur3)"/>
        <circle class="jf-ring"   cx="1340" cy="100" r="180" fill="none" stroke="#00a4dc" stroke-width="1.5"/>
        <circle class="jf-ring-2" cx="100"  cy="800" r="140" fill="none" stroke="#aa5cc3" stroke-width="1"/>
        <pattern id="jf-dots" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
            <circle cx="2" cy="2" r="1" fill="rgba(255,255,255,0.05)"/>
        </pattern>
        <rect width="100%" height="100%" fill="url(#jf-dots)"/>
    </svg>
</div>
<div class="jf-wizard-particles" aria-hidden="true">
    <span></span><span></span><span></span><span></span>
    <span></span><span></span><span></span><span></span>
</div>
<div class="jf-wizard-logo" aria-hidden="true"></div>
