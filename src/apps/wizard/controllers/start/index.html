<div class="jf-wizard-particles" aria-hidden="true"><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span></div>

    <div class="padded-left padded-right padded-top">
        <div class="ui-corner-all ui-shadow wizardContent" style="position:relative;">
            <form class="wizardStartForm">
                <div>
                    <h1 style="float:left;">${WelcomeToProject}</h1>
                    <a is="emby-linkbutton" rel="noopener noreferrer" href="https://jellyfin.org/docs/general/post-install/setup-wizard/" target="_blank" class="raised raised-alt" style="float:right;margin-top:20px;">
                        <span>${ButtonQuickStartGuide}</span>
                    </a>
                </div>

                <br style="clear:both;" />
                <p>${ThisWizardWillGuideYou}</p>
                <br />
                <div class="inputContainer">
                    <input is="emby-input" type="text" id="txtServerName" label="${LabelServerName}" required="required" />
                    <div class="fieldDescription">${LabelServerNameHelp}</div>
                </div>
                <div class="selectContainer">
                    <select is="emby-select" id="selectLocalizationLanguage" label="${LabelPreferredDisplayLanguage}"></select>
                </div>
                <br />

                <div class="wizardNavigation" style="text-align:right;">
                    <button is="emby-button" type="submit" class="raised button-submit">
                        <span>${Next}</span>
                        <span class="material-icons arrow_forward" aria-hidden="true"></span>
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
